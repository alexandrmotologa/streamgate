services:
  streamgate:
    build:
      context: .
      dockerfile: Dockerfile
    image: streamgate:latest
    container_name: streamgate
    ports:
      - "8080:8080"
    environment:
      - STREAMGATE_HOST=0.0.0.0
      - STREAMGATE_PORT=8080
      - STREAMGATE_RING_BUFFER_SIZE=2048
      - STREAMGATE_CLIENT_BUFFER_SIZE=512
      - STREAMGATE_HEARTBEAT_INTERVAL=15
      - STREAMGATE_DROP_POLICY=drop_oldest
      - STREAMGATE_ENABLE_WEB_UI=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
